name: Refresh dashboard

# Hosting is on Vercel. This workflow crawls, saves the data in the repo,
# and asks Vercel to redeploy. (It does not use GitHub Pages.)

on:
  schedule:
    - cron: "30 2 * * *"        # 08:00 IST every day
  workflow_dispatch:             # "Run workflow" button
  push:
    branches: [main]             # run the tests and a test build after code edits

permissions:
  contents: write                # commit data/live/*

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Crawl (scheduled and manual runs only)
        if: github.event_name != 'push'
        continue-on-error: true  # a failed crawl must not stop the last good data from being used
        env:
          TROVELLE_SEO_UA: "TrovelleSEOBot/1.0 (+https://github.com/${{ github.repository }})"
        run: python -m trovelle_seo crawl

      - name: Build site (test build)
        run: python -m trovelle_seo build

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "trovelle-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh crawl data and history"
            git push
          fi

      - name: Trigger Vercel redeploy (optional)
        if: github.event_name != 'push'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel redeploy triggered"; else echo "No VERCEL_DEPLOY_HOOK secret set; skipping"; fi
